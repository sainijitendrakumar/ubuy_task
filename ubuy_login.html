                        <script type="text/javascript">
                            var login_context_type = "";
                            var chnageinopenmethod = 1;
                            function _loginwithfacebook() {
                                if (chnageinopenmethod) {
                                    loginwithfacebook = window.open('about:blank', 'loginwithfacebook', "menubar=0,resizable=1,width=800,height=450");
                                    loginwithfacebook.location = 'https://www.ubuy.co.in/customer/account/login/?type=facebook&context=' + login_context_type;
                                } else {
                                    loginwithfacebook = window.open('https://www.ubuy.co.in/customer/account/login/?type=facebook&context=' + login_context_type, "loginwithfacebook", "menubar=0,resizable=1,width=800,height=450");
                                }
                                fbloginInterval = setInterval(function () {
                                    if (loginwithfacebook.location.hash) {
                                        fbcloseWin(loginwithfacebook.location.hash);
                                    }
                                }, 1000);
                            }

                            function fbcloseWin(locationhash) {
                                var redirect_url = 'https://www.ubuy.co.in/customer/account/create/';
                                if (localStorage.getItem('social_redirect_url')) {
                                    redirect_url = localStorage.getItem('social_redirect_url');
                                    localStorage.removeItem('social_redirect_url');
                                }
                                loginwithfacebook.close();   // Closes the new window
                                clearInterval(fbloginInterval)
                                fbloginInterval = null;
                                location.href = redirect_url;
                            }

                            function _loginwithgoogle() {
                                if (typeof auth2 == 'undefined') {
                                    jQuery.getScript('https://apis.google.com/js/client:platform.js?onload=glogin_start', function () {
                                        //Stuff to do after someScript has loaded
                                        // glogin_start();
                                    });
                                } else {
                                    auth2.signIn().then(glogin_signInCallback, glogin_handleFailure);
                                }
                            }

                            jQuery(".facebook-login-action").on('click', function (event) {
                                checkIsAlreadyLogin(_loginwithfacebook);
                            });

                            jQuery(".google-login-action").on('click', function (event) {
                                checkIsAlreadyLogin(_loginwithgoogle);
                            });

                            jQuery(".google-login-check-action").on('click', function (event) {
                                checkIsAlreadyLogin(function () { });
                            });

                            function checkIsAlreadyLogin(cb, param1, param2) {
                                var xhr = new XMLHttpRequest();
                                const url = 'https://www.ubuy.co.in/customer/account/login/';
                                xhr.onload = function () {
                                    if (this.responseURL != url) {
                                        window.location.reload();
                                    } else {
                                        cb(param1, param2);
                                        console.log('doesn\'t redirect ');
                                    }
                                }
                                xhr.open('HEAD', url, true);
                                xhr.send();
                            }
                        </script>
                        <script>
                            function handleGoogleLoginResponse(response) {
                                checkIsAlreadyLogin(function () {
                                    location.href = 'https://www.ubuy.co.in/customer/account/login/?type=google&context=' + login_context_type + '&id_token=' + response.credential + '&referral=';
                                    return false;
                                });
                            }
                            /*Google Login Script -- START*/
                            function glogin_start() {
                                gapi.load('auth2', function () {
                                    auth2 = gapi.auth2.init({
                                        client_id: '846617631052-nt5kpq4mfqva3lsfjiqbg5urfum3q402.apps.googleusercontent.com',
                                        // Scopes to request in addition to 'profile' and 'email'
                                        //scope: 'additional_scope'
                                    });
                                    auth2.signIn().then(glogin_signInCallback, glogin_handleFailure);
                                });
                            }
                            function glogin_signOut() {
                                auth2.signOut().then(function () {
                                    console.log('User signed out.');
                                });
                            }
                            function glogin_handleFailure(error) {
                                //If Google OAuth 2 occured error
                                if (error.error === 'popup_closed_by_user') {
                                    // window.close();
                                }
                            }
                            function glogin_signInCallback() {
                                var authrizeData = auth2.currentUser.get().getAuthResponse(true);
                                let id_token = authrizeData.id_token;
                                if (auth2.isSignedIn.get()) {
                                    location.href = 'https://www.ubuy.co.in/customer/account/login/?type=google&context=' + login_context_type + '&id_token=' + id_token;
                                } else {
                                    location.reload();
                                }
                            }
                            /*Google Login Script -- END*/
                        </script>
                        <script>
                            function _loginWithPaypal(code, type) {
                                location.href = 'https://www.ubuy.co.in/customer/account/login/?code=' + code + '&type=' + type;
                            }

                            function payPalAuthButton() {
                                try {
                                    paypal.AuthButton({
                                        // List of scopes you want the user to share with you
                                        scopes: ["openid", "profile", "email", "address", "https://uri.paypal.com/services/paypalattributes"],
                                        // Set responseType if needed for your integration
                                        responseType: 'id_token',
                                        locale: 'en-us',
                                        // Set the style of button
                                        style: {
                                            label: 'continue', // connect, signup, continue
                                            color: 'blue', // silver, blue
                                            height: 35, // 35 to 50
                                            shape: 'rect' // rect, pill
                                        },

                                        //Finalize the log in with PayPal flow
                                        onApprove: function (data) {
                                            var authCode = data.authCode; // Get the authorization code
                                            var type = 'paypal';
                                            checkIsAlreadyLogin(_loginWithPaypal, authCode, type)
                                        },
                                        onCancel: function (data, actions) {
                                            alert('User did not consent');
                                            // Show a cancel page or return to cart
                                        },
                                    }).render('#paypal_login_button');
                                } catch (e) {
                                    setTimeout(() => {
                                        payPalAuthButton();
                                    }, 1000);
                                }

                            }

                            payPalAuthButton();
                        </script>
